<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | HOPI CRUNCH-BY IAN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">HOPI CRUNCH-BY IAN</div>
      <nav>
        <a href="index.html">Welcome</a>
        <a href="order.html">Order Items</a>
        <a href="admin-login.html">Admin Login</a>
      </nav>
    </header>

    <main class="content">
      <section class="page-title">
        <p class="eyebrow">Admin dashboard</p>
        <h1>All user orders</h1>
        <p>View the orders placed by customers and their account details.</p>
      </section>

      <section class="card table-card">
        <div id="admin-error" class="status-message error"></div>
        <table id="orders-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Contact</th>
              <th>Address</th>
              <th>Items ordered</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="db.js"></script>
    <script>
      const adminError = document.getElementById('admin-error');
      const ordersTableBody = document.querySelector('#orders-table tbody');
      const adminLoggedIn = localStorage.getItem('hopiCrunchAdminLoggedIn');

      async function renderOrders() {
        if (adminLoggedIn !== 'true') {
          adminError.textContent = 'You must log in as admin first.';
          ordersTableBody.innerHTML = '<tr><td colspan="5">Access denied.</td></tr>';
          return;
        }

        const orders = await getOrders();
        if (!orders.length) {
          ordersTableBody.innerHTML = '<tr><td colspan="5">No orders have been placed yet.</td></tr>';
          return;
        }

        ordersTableBody.innerHTML = orders
          .map((order) => {
            const items = order.items.map((item) => `${item.name} x${item.qty}`).join(', ');
            return `
                <tr>
                  <td>${order.user.name} (${order.user.username})</td>
                  <td>${order.user.cpNumber}</td>
                  <td>${order.user.address}</td>
                  <td>${items}</td>
                  <td>₱${order.total.toFixed(2)}</td>
                </tr>
              `;
          })
          .join('');
      }

      renderOrders();
    </script>
  </body>
</html>
