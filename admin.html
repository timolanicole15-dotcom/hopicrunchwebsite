 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | HOPI CRUNCH-BY IAN</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Filter & Control Styling */
      .filter-container {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .filter-container select {
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }
      
      /* Action Buttons & Status Badges */
      .action-btns {
        display: flex;
        gap: 8px;
      }
      .btn-confirm {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-deny {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .btn-confirm:hover { background-color: #218838; }
      .btn-deny:hover { background-color: #c82333; }

      .status-badge {
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .status-badge.confirmed { color: #28a745; }
      .status-badge.denied { color: #dc3545; }
      .status-badge.pending { color: #ffc107; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">HOPI CRUNCH-BY IAN</div>
      <nav>
        <a href="#" id="logout-btn">Logout</a>
      </nav>
    </header>

    <main class="content">
      <section class="page-title">
        <p class="eyebrow">Admin dashboard</p>
        <h1>All user orders</h1>
        <p>View, filter, and manage customer order statuses.</p>
      </section>

      <section class="card table-card">
        <div id="admin-error" class="status-message error"></div>
        
        <!-- Filter Orders by User -->
        <div class="filter-container">
          <label for="user-filter"><strong>Filter by User:</strong></label>
          <select id="user-filter">
            <option value="ALL">All Users</option>
          </select>
        </div>

        <!-- Added class="orders-table" for mobile responsiveness -->
        <table id="orders-table" class="orders-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Contact</th>
              <th>Address</th>
              <th>Items ordered</th>
              <th>Total</th>
              <th>Status / Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="db.js"></script>
    <script>
      const adminError = document.getElementById('admin-error');
      const ordersTableBody = document.querySelector('#orders-table tbody');
      const userFilter = document.getElementById('user-filter');
      const adminLoggedIn = localStorage.getItem('hopiCrunchAdminLoggedIn');
      const logoutBtn = document.getElementById('logout-btn');

      let currentOrders = [];

      // Logout Functionality
      if (logoutBtn) {
        logoutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.removeItem('hopiCrunchAdminLoggedIn');
          window.location.href = 'admin-login.html';
        });
      }

      // Populate User Dropdown Options
      function populateUserFilter(orders) {
        const users = new Set();
        orders.forEach(o => {
          if (o.user && o.user.username) {
            users.add(o.user.username);
          }
        });

        userFilter.innerHTML = '<option value="ALL">All Users</option>';
        users.forEach(username => {
          const option = document.createElement('option');
          option.value = username;
          option.textContent = username;
          userFilter.appendChild(option);
        });
      }

      // Render the Orders Table with data-label for Mobile CSS
      function renderTableRows(ordersToRender) {
        if (!ordersToRender.length) {
          ordersTableBody.innerHTML = '<tr><td colspan="6">No orders found.</td></tr>';
          return;
        }

        ordersTableBody.innerHTML = ordersToRender
          .map((order) => {
            const items = order.items.map((item) => `${item.name} x${item.qty}`).join(', ');
            
            // Generate Action buttons or Status badge
            let actionContent = '';
            if (order.status === 'confirmed') {
              actionContent = `<span class="status-badge confirmed">✓ Confirmed</span>`;
            } else if (order.status === 'denied') {
              actionContent = `<span class="status-badge denied">✗ Denied</span>`;
            } else {
              actionContent = `
                <div class="action-btns">
                  <button class="btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')">Confirm</button>
                  <button class="btn-deny" onclick="updateOrderStatus('${order.id}', 'denied')">Deny</button>
                </div>
              `;
            }

            return `
              <tr>
                <td data-label="User">${order.user.name} (${order.user.username})</td>
                <td data-label="Contact">${order.user.cpNumber}</td>
                <td data-label="Address">${order.user.address}</td>
                <td data-label="Items ordered">${items}</td>
                <td data-label="Total">₱${order.total.toFixed(2)}</td>
                <td data-label="Status / Action">${actionContent}</td>
              </tr>
            `;
          })
          .join('');
      }

      // Fetch and Initialize Orders
      async function fetchAndRenderOrders() {
        if (adminLoggedIn !== 'true') {
          adminError.textContent = 'You must log in as admin first.';
          ordersTableBody.innerHTML = '<tr><td colspan="6">Access denied.</td></tr>';
          return;
        }

        currentOrders = await getOrders();
        populateUserFilter(currentOrders);
        filterAndRender();
      }

      // Filter Handler
      function filterAndRender() {
        const selectedUser = userFilter.value;
        if (selectedUser === 'ALL') {
          renderTableRows(currentOrders);
        } else {
          const filtered = currentOrders.filter(o => o.user && o.user.username === selectedUser);
          renderTableRows(filtered);
        }
      }

      userFilter.addEventListener('change', filterAndRender);

      // Status Update Function
      async function updateOrderStatus(orderId, newStatus) {
        if (typeof updateOrder === 'function') {
          await updateOrder(orderId, { status: newStatus });
        }
        
        const targetOrder = currentOrders.find(o => o.id === orderId);
        if (targetOrder) {
          targetOrder.status = newStatus;
        }
        filterAndRender();
      }

      fetchAndRenderOrders();
    </script>
  </body>
</html>
