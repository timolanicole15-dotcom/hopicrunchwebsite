<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | HOPI CRUNCH-BY IAN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">HOPI CRUNCH-BY IAN</div>
      <nav>
        <a href="index.html">Welcome</a>
        <a href="order.html">Order Items</a>
        <a href="login.html" class="active">Login</a>
      </nav>
    </header>

    <main class="content">
      <section class="page-title">
        <p class="eyebrow">Customer Login</p>
        <h1>Sign in to place your order</h1>
        <p>Use your username and password to access the order page.</p>
      </section>

      <section class="card form-card">
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <button class="button" type="submit">Login</button>
          <div id="login-status" class="status-message"></div>
        </form>
        <p>
          Don't have an account yet? <a href="signup.html">Sign up here</a>.
        </p>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
    <script src="db.js"></script>
    <script>
      const loginForm = document.getElementById('login-form');
      const loginStatus = document.getElementById('login-status');

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const user = await findUserByUsername(username);

        if (!user || user.password !== password) {
          loginStatus.textContent = 'Username or password is incorrect.';
          loginStatus.className = 'status-message error';
          return;
        }

        setCurrentUser(user);
        window.location.href = 'order.html';
      });
    </script>
  </body>
</html>
